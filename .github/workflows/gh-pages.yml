name: Deploy to GitHub Pages

on:
  push:
    branches: [ v2.0 ]

jobs:
  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare published app
        run: |
          mkdir -p ./public
          cp index.html app.js style.css sw.js manifest.json icon-192.png icon-512.png ./public/
          echo "${{ github.sha }}" > ./public/deployed_commit.txt

      - name: Deploy app to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
